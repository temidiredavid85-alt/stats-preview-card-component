    <title>Stats Preview Card</title>

</head>

                </div>

                <div>
                    <h2>314</h2>
                    <span>TEMPLATES</span>

                    <h2>12M+</h2>
                    <span>QUERIES</span>
                </div>
            </div>
        </div>

        <div class="image">
            <img src="images/image-header-desktop.jpg" alt="People working in an office">
        </div>

    </div>

</html>
